[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "macroalgae-pressure-potential"
version = "0.1.0"
description = "Reproducible analysis for global macroalgal nutrient pressure–potential mismatch"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
